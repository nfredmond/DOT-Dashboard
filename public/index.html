<head>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/leaflet-fallback.css" />
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Fallback script to ensure Leaflet is available -->
  <script>
    // This script ensures Leaflet is properly loaded
    window.addEventListener('DOMContentLoaded', function() {
      if (!window.L) {
        console.log('Leaflet not detected, loading fallback');
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.onload = function() {
          console.log('Leaflet loaded via fallback');
        };
        document.head.appendChild(script);
      } else {
        console.log('Leaflet already loaded');
      }
    });
  </script>
</head>

    <!-- Next.js will render the app here -->
  </div>
